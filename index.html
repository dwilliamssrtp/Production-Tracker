}

function renderWoDashboard(g, serverTime){
  var root = E('wodRoot');
  if (!root) return;
  var counts = {complete:0, inprogress:0, notstarted:0};
  g.pipes.forEach(function(p){
    if (p.overallStatus === 'Complete') { counts.complete++; return; }
    var anyStarted = [p.blStatus, p.brStatus, p.cvStatus].some(function(s){ return s !== 'Not started'; });
    if (anyStarted) counts.inprogress++; else counts.notstarted++;
  });

  var cardsHtml = g.pipes.map(function(p){
    var lr = p.lastReading;
    var stale = lr && (Date.now() - new Date(lr.Timestamp).getTime()) > 75*60000 && p.overallStatus !== 'Complete';
    var lrHtml = lr
      ? (esc(lr.Value)+'" '+esc(lr.Type)+' <span class="dot '+(lr.InTol==='Y'?'good':lr.InTol==='N'?'bad':'none')+'"></span> <span class="muted">'+fmtRel(lr.Timestamp)+'</span>')
      : '<span class="muted">no readings yet</span>';
    return '<div class="pipecard" data-pipe="'+esc(p.pipeCode)+'">' +
      '<div class="pipecard-head"><b>'+esc(p.pipeCode)+'</b>'+pillHtml(p.overallStatus)+'</div>' +
      (p.openProblems ? '<div style="margin-bottom:6px">'+problemBadge(p.openProblems)+'</div>' : '') +
      '<div class="pipecard-stages">'+pillHtml(p.blStatus)+pillHtml(p.brStatus)+pillHtml(p.cvStatus)+'</div>' +
      '<div class="pipecard-reading">'+lrHtml+(stale?' <span class="flag">STALE</span>':'')+'</div>' +
    '</div>';
  }).join('');

  root.innerHTML =
    '<div class="row" style="margin-bottom:10px">' +
      '<div><b style="font-size:20px">'+esc(g.workOrderCode)+'</b> ' +
      '<span class="pill inprogress">'+g.pipes.length+' reel'+(g.pipes.length===1?'':'s')+'</span> ' +
      problemBadge(g.openProblems) + ' ' +
      '<span class="muted">'+esc(g.customer||'')+(g.productCode?' &middot; '+esc(g.productCode):'')+'</span></div>' +
      '<span class="spacer"></span>' +
      '<button class="btn sm" id="wodAddPipeBtn">+ Add reel</button>' +
      '<button class="btn sm" id="wodEditBtn">Edit targets</button>' +
      '<button class="btn sm" id="wodArchiveBtn">Archive</button>' +
      '<button class="btn sm" id="wodBackBtn">Back to dashboard</button>' +
    '</div>' +
    '<section class="card">' +
      lengthProgressHtml(g) +
      '<div class="kpis" style="margin-top:8px">' +
        '<div class="kpi"><b>Total reels</b><span>'+g.pipes.length+'</span></div>' +
        '<div class="kpi"><b>Complete</b><span>'+counts.complete+'</span></div>' +
        '<div class="kpi"><b>In progress</b><span>'+counts.inprogress+'</span></div>' +
        '<div class="kpi"><b>Not started</b><span>'+counts.notstarted+'</span></div>' +
      '</div>' +
      '<div class="pipecard-grid">' + cardsHtml + '</div>' +
      '<div class="muted" style="margin-top:10px;font-size:10px">Auto-refreshing every 20s &middot; server time '+fmtTime(serverTime)+' &middot; click a reel for its full detail/chart</div>' +
    '</section>';

  E('wodBackBtn').addEventListener('click', function(){ go('dashboard'); });
  E('wodAddPipeBtn').addEventListener('click', function(){ go('addPipe', {workOrderCode: g.workOrderCode}); });
  E('wodArchiveBtn').addEventListener('click', function(){
    // Archiving from here removes what you're looking at, so go somewhere that still exists.
    archiveWorkOrder(g.workOrderCode, (g.activePipes || []).length, function(){ go('dashboard'); });
  });
  E('wodEditBtn').addEventListener('click', function(){
    E('wodEditBtn').disabled = true;
    apiGet('getWorkOrderInfo', {code: g.workOrderCode}).then(function(info){
      STATE.workOrder = info.workOrder;
      go('controller', {workOrderCode: g.workOrderCode});
    }).catch(function(err){ toast(err.message, true); E('wodEditBtn').disabled = false; });
  });
  qsa('.pipecard', root).forEach(function(c){
    c.addEventListener('click', function(){ go('pipeDetail', {pipeCode: c.dataset.pipe}); });
  });
}

/* ============================= ARCHIVE (admin only) =============================
 * Where archived work orders live, and the only place anything can be destroyed.
 *
 * Deleting is staged on purpose: a job has to be archived first (the server enforces
 * that, not just this screen), then the controller is shown exactly what would be
 * destroyed — reel count, readings, thickness checks, photos, the lot — and has to
 * retype the work order code. It is the one irreversible action in the app.
 */
function viewArchive(){ return '<div id="arRoot"><p class="muted">Loading&hellip;</p></div>'; }

function bindArchive(){ loadArchive(); }

function loadArchive(){
  apiGet('listArchive').then(function(d){ STATE.archive = d.workOrders; renderArchive(); })
    .catch(function(err){
      if (err && err.sessionExpired) return;
      var r = E('arRoot'); if (r) r.innerHTML = '<p class="flag">'+esc(err.message)+'</p>';
    });
}

function renderArchive(){
  var root = E('arRoot');
  if (!root) return;
  var list = STATE.archive || [];

  var cards = list.map(function(w){
    return '<section class="card">' +
      '<div class="row"><b style="font-size:15px">'+esc(w.code)+'</b>' +
        '<span class="pill inprogress">'+w.pipeCount+' reel'+(w.pipeCount===1?'':'s')+'</span>' +
        '<span class="muted">'+esc(w.customer||'')+(w.productCode?' &middot; '+esc(w.productCode):'')+
          (w.pipeSize?' &middot; '+esc(w.pipeSize):'')+'</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn sm" data-unarchive="'+esc(w.code)+'">Restore</button>' +
        '<button class="btn sm danger" data-delwo="'+esc(w.code)+'">Delete permanently</button>' +
      '</div>' +
      '<div class="muted" style="font-size:10.5px;margin-top:4px">' +
        'Archived '+esc(fmtTime(w.archivedAt))+(w.archivedBy?' by '+esc(w.archivedBy):'')+
        ' &middot; '+w.completePipes+' of '+w.pipeCount+' reels complete' +
        (w.pipeCodes.length ? ' &middot; '+esc(w.pipeCodes.join(', ')) : '') +
      '</div>' +
      '<div id="delbox-'+esc(w.code)+'"></div>' +
    '</section>';
  }).join('');

  root.innerHTML =
    '<div class="row" style="margin-bottom:10px">' +
      '<h1 style="font-size:13px">Archive ('+list.length+')</h1>' +
      '<span class="spacer"></span>' +
      '<button class="btn" data-nav="dashboard">Back to dashboard</button>' +
    '</div>' +
    '<p class="muted" style="margin-top:0">Archived work orders are off the dashboard, the Timers page and the TV view, but nothing has been deleted &mdash; <b>Restore</b> puts one back exactly as it was. Deleting is permanent and is the only thing in this app that destroys production history.</p>' +
    (list.length ? cards : '<section class="card"><p class="muted">Nothing archived.</p></section>');

  qsa('[data-unarchive]', root).forEach(function(b){
    b.addEventListener('click', function(){
      apiPost('unarchiveWorkOrder', {code: b.dataset.unarchive})
        .then(function(){ toast(b.dataset.unarchive + ' restored'); loadArchive(); })
        .catch(function(err){ if (!err.sessionExpired) toast(err.message, true); });
    });
  });
  qsa('[data-delwo]', root).forEach(function(b){
    b.addEventListener('click', function(){ showDeletePreview(b.dataset.delwo); });
  });
}

// Fetches and shows what would actually be destroyed, then asks for the code to be
// retyped. Nobody should be confirming a number they haven't been shown.
function showDeletePreview(code){
  var box = E('delbox-' + code);
  if (!box) return;
  box.innerHTML = '<p class="muted">Checking what this would delete&hellip;</p>';
  apiGet('workOrderDeletePreview', {code: code}).then(function(p){
    var c = p.counts;
    var lines = [
      ['Reels', c.pipes], ['OD / pitch readings', c.readings], ['Thickness checks', c.thicknessChecks],
      ['Notes', c.notes], ['Photos', c.photos], ['Material usage rows', c.materialUsage],
      ['Problem reports', c.problemReports], ['Downtime events', c.downtimeEvents]
    ].filter(function(l){ return l[1] > 0; });

    box.innerHTML =
      '<div class="card" style="border-color:var(--crit);margin-top:10px">' +
        '<h3 style="color:var(--crit);margin-top:0">Delete '+esc(code)+' permanently</h3>' +
        '<p style="margin:0 0 6px">This erases the work order and everything logged against it. It cannot be undone.</p>' +
        (lines.length
          ? '<table style="margin:6px 0"><tbody>' + lines.map(function(l){
              return '<tr><td class="l">'+l[0]+'</td><td class="num"><b>'+l[1]+'</b></td></tr>';
            }).join('') + '</tbody></table>'
          : '<p class="muted">No production data was ever logged against this work order.</p>') +
        (c.photos > 0 ? '<p class="muted" style="font-size:10.5px">The '+c.photos+' photo'+(c.photos===1?'':'s')+' will be moved to your Google Drive trash, where Drive keeps them for about 30 days.</p>' : '') +
        '<div class="row" style="margin-top:8px">' +
          '<div class="fld" style="flex:1;max-width:260px"><label>Type <b>'+esc(code)+'</b> to confirm</label>' +
            '<input id="delconfirm-'+esc(code)+'" autocapitalize="none" autocomplete="off"></div>' +
          '<button class="btn sm" data-delcancel="'+esc(code)+'" style="align-self:flex-end">Cancel</button>' +
          '<button class="btn sm danger" data-delconfirm="'+esc(code)+'" style="align-self:flex-end">Delete permanently</button>' +
        '</div>' +
      '</div>';

    var input = E('delconfirm-' + code);
    input.focus();
    box.querySelector('[data-delcancel]').addEventListener('click', function(){ box.innerHTML = ''; });
    box.querySelector('[data-delconfirm]').addEventListener('click', function(){
      doDeleteWorkOrder(code, input.value.trim(), this);
    });
    input.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter') doDeleteWorkOrder(code, input.value.trim(), null);
    });
  }).catch(function(err){
    if (err && err.sessionExpired) return;
    box.innerHTML = '<p class="flag">'+esc(err.message)+'</p>';
  });
}

function doDeleteWorkOrder(code, confirmCode, btn){
  if (confirmCode !== code){ toast('Type the work order code exactly to confirm', true); return; }
  if (btn) btn.disabled = true;
  apiPost('deleteWorkOrder', {code: code, confirmCode: confirmCode})
    .then(function(res){
      var n = res.deleted || {};
      toast(code + ' deleted — ' + (n.pipes||0) + ' reel(s) and all their data removed');
      if (res.photosNotTrashed) toast(res.photosNotTrashed + ' photo file(s) could not be trashed in Drive', true);
      loadArchive();
    })
    .catch(function(err){
      if (btn) btn.disabled = false;
      if (!err.sessionExpired) toast(err.message, true);
    });
}

/* ============================= REPORTS (admin only) =============================
 * One reel's complete record on a single scrolling page: the recipe/setup it was
 * built to, every measurement logged against it, the OD chart, and run speed. It
 * re-polls the same getPipe the operator view uses, so it tracks the floor live
 * rather than being a snapshot someone has to regenerate.
 *
 * Deliberately one continuous document rather than tabbed by section — this is the
 * thing you print or hand to a customer, and a report split across tabs prints as
 * whichever tab happened to be open.
 *
 * No new backend actions: it reads 'dashboard' (for the picker) and 'getPipe', both
 * already Admin-only in ACTION_ROLES.
 */
var REPORT_MAX_CHECK_COLS = 8; // thickness columns shown before the table gets unreadable

function viewReports(){ return '<div id="rpRoot"><p class="muted">Loading&hellip;</p></div>'; }

function bindReports(){
  if (STATE.rpPipe) loadReport(STATE.rpPipe); else loadReportIndex();
  // go() calls stopPolling() on navigation, so this stops itself when you leave.
  STATE.dashTimer = pollEvery(function(){
    if (STATE.view === 'reports' && STATE.rpPipe) loadReport(STATE.rpPipe, true);
  }, 20000);
}

function loadReportIndex(){
  STATE.rpPipe = null; STATE.rpData = null;
  apiGet('dashboard').then(function(d){ STATE.rpIndex = d; renderReportIndex(); })
    .catch(function(err){
      if (err && err.sessionExpired) return;
      var r = E('rpRoot'); if (r) r.innerHTML = '<p class="flag">'+esc(err.message)+'</p>';
    });
}

// quiet = a background refresh; don't blank the page out from under someone reading it.
function loadReport(pipeCode, quiet){
  if (!quiet){ var r = E('rpRoot'); if (r) r.innerHTML = '<p class="muted">Loading report&hellip;</p>'; }
  apiGet('getPipe', {pipeCode: pipeCode}).then(function(data){
    STATE.rpPipe = pipeCode; STATE.rpData = data; STATE.rpLoadedAt = new Date();
    renderReport();
  }).catch(function(err){
    if (err && err.sessionExpired) return;
    if (quiet) return; // a failed background poll keeps the last good render on screen
    var r2 = E('rpRoot'); if (r2) r2.innerHTML = '<p class="flag">'+esc(err.message)+'</p>';
  });
}

function renderReportIndex(){
  var root = E('rpRoot');
  if (!root) return;
  var d = STATE.rpIndex || {active: [], recentComplete: []};

  function groupBlock(g){
    return '<div style="margin-bottom:12px">' +
      '<div class="row" style="gap:6px"><b>'+esc(g.workOrderCode)+'</b>' +
        '<span class="muted">'+esc(g.customer||'')+(g.productCode?' &middot; '+esc(g.productCode):'')+'</span></div>' +
      '<table style="margin-top:4px"><thead><tr><th class="l">Reel</th><th>Baseline</th><th>Braidline</th>' +
        '<th>Coverline</th><th>Last activity</th><th>&nbsp;</th></tr></thead><tbody>' +
      g.pipes.map(function(p){
        return '<tr><td class="l">'+esc(p.pipeCode)+'</td>' +
          '<td>'+pillHtml(p.blStatus)+'</td><td>'+pillHtml(p.brStatus)+'</td><td>'+pillHtml(p.cvStatus)+'</td>' +
          '<td class="muted">'+esc(fmtRel(p.lastUpdated))+'</td>' +
          '<td><button class="btn sm pri" data-report="'+esc(p.pipeCode)+'">Open report</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  root.innerHTML =
    '<h1 style="font-size:13px;margin-bottom:4px">Reports</h1>' +
    '<p class="muted" style="margin-top:0">Pick a reel for its full live record — setup reference, every measurement, the OD chart and run speed. Refreshes itself every 20 seconds while open.</p>' +
    '<section class="card"><h2>In production</h2>' +
      (d.active.length ? d.active.map(groupBlock).join('') : '<p class="muted">Nothing in production right now.</p>') +
    '</section>' +
    (d.recentComplete && d.recentComplete.length
      ? '<section class="card"><h2>Recently completed</h2>' + d.recentComplete.map(groupBlock).join('') + '</section>'
      : '');

  qsa('[data-report]', root).forEach(function(b){
    b.addEventListener('click', function(){ loadReport(b.dataset.report); });
  });
}

/* ---------- report building blocks ---------- */

function rpShortTime(iso){
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.toLocaleDateString([], {month:'numeric', day:'numeric'}) + ' ' +
         d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

// Speed is reported two ways because they answer different questions: the recipe's
// target, and what the line actually did (from the footage markers logged with OD
// checks). Pace is the honest comparison of the two.
function rpSpeedCellsHtml(wo, readings, sec, prefix){
  var target = wo[prefix+'_LineSpeed'];
  var actual = computeActualSpeed(readings, sec);
  var pace = (actual && actual.avg && target !== '' && target !== undefined && Number(target) > 0)
    ? Math.round(actual.avg / Number(target) * 100) : null;
  return '<div class="kpi"><b>Target speed</b><span>'+fmtTol(target)+'</span><i>ft/min, recipe</i></div>' +
    '<div class="kpi"><b>Actual &mdash; current</b><span>'+(actual && actual.current !== null ? actual.current : '—')+'</span><i>ft/min, last interval</i></div>' +
    '<div class="kpi"><b>Actual &mdash; average</b><span>'+(actual && actual.avg !== null ? actual.avg : '—')+'</span><i>ft/min, whole run</i></div>' +
    '<div class="kpi"><b>Pace</b><span'+(pace !== null && (pace < 85 || pace > 115) ? ' class="flag"' : '')+'>' +
      (pace !== null ? pace + '%' : '—')+'</span><i>'+(actual ? actual.points+' footage marks' : 'needs 2 footage marks')+'</i></div>';
}

function rpSectionSummaryHtml(data, sec){
  var wo = data.workOrder, pipe = data.pipe;
  var prefix = sec==='Baseline'?'BL':sec==='Braidline'?'BR':'CV';
  var timing = computeProdTiming(wo, pipe, sec, data.downtimeEvents || []);
  var targetLen = wo[prefix+'_TargetLength'], actualLen = pipe[prefix+'_ActualLength'];

  var timeCells = '';
  if (timing){
    timeCells =
      '<div class="kpi"><b>Running time</b><span>'+fmtHrsMin(timing.runningMinutes)+'</span>' +
        '<i>'+(timing.status === 'down' ? 'DOWN — '+esc(timing.downReason||'no reason given') : 'running now')+'</i></div>' +
      '<div class="kpi"><b>Down time</b><span>'+fmtHrsMin(timing.downMinutes)+'</span><i>this section</i></div>' +
      '<div class="kpi"><b>Expected</b><span>'+(timing.expectedMinutes!=='' ? fmtHrsMin(timing.expectedMinutes) : '—')+'</span><i>target length &divide; speed</i></div>';
  } else {
    var started = pipe[prefix+'_StartedAt'], done = pipe[prefix+'_CompletedAt'];
    timeCells =
      '<div class="kpi"><b>Started</b><span style="font-size:12px">'+rpShortTime(started)+'</span></div>' +
      '<div class="kpi"><b>Completed</b><span style="font-size:12px">'+rpShortTime(done)+'</span></div>' +
      '<div class="kpi"><b>Elapsed</b><span>'+((started && done) ? fmtHrsMin((new Date(done)-new Date(started))/60000) : '—')+'</span><i>start to finish</i></div>';
  }

  return '<section class="card">' +
    '<div class="row" style="margin-bottom:6px"><h3 style="margin:0">'+sec+'</h3>'+pillHtml(pipe[prefix+'_Status'])+'</div>' +
    '<div class="kpis">' +
      '<div class="kpi"><b>Length</b><span>'+fmtTol(actualLen)+'</span><i>of '+fmtTol(targetLen)+' ft target</i></div>' +
      timeCells +
    '</div>' +
    '<div class="kpis" style="margin-top:6px">' + rpSpeedCellsHtml(wo, data.readings, sec, prefix) + '</div>' +
  '</section>';
}

function rpReadingsTableHtml(readings, sec){
  var rows = readings.filter(function(r){ return r.Section === sec; })
    .sort(function(a,b){ return new Date(a.Timestamp) - new Date(b.Timestamp); });
  if (!rows.length) return '<p class="muted">No readings logged.</p>';
  return '<table style="margin-top:6px"><thead><tr><th class="l">Time</th><th class="l">Operator</th>' +
      '<th>Type</th><th>Value</th><th>Footage</th><th>In tol</th></tr></thead><tbody>' +
    rows.map(function(r){
      var tol = r.InTol === true || r.InTol === 'TRUE' ? '<span class="ok">yes</span>'
              : (r.InTol === false || r.InTol === 'FALSE') ? '<span class="flag">NO</span>' : '<span class="muted">—</span>';
      return '<tr><td class="l">'+esc(rpShortTime(r.Timestamp))+'</td><td class="l">'+esc(r.Operator)+'</td>' +
        '<td>'+esc(r.Type)+'</td><td class="num">'+esc(r.Value)+'</td>' +
        '<td class="num">'+(r.Footage===''||r.Footage===undefined?'—':esc(r.Footage))+'</td><td>'+tol+'</td></tr>';
    }).join('') + '</tbody></table>';
}

// Every individual wall reading, laid out the way it was taken: one row per clock
// point, one column per check. This is the part the summary table (avg/ID/ovality)
// throws away, and it's what shows a die running consistently off-centre.
function rpThicknessPointsHtml(sec, checks){
  if (!checks.length) return '';
  var n = pointCount(sec);
  var shown = checks.slice(-REPORT_MAX_CHECK_COLS);

  var head = '<tr><th class="l">Point</th>' + shown.map(function(c){
    return '<th>'+esc(c.Position||'')+'<br><span class="muted" style="font-weight:400">'+esc(rpShortTime(c.Timestamp))+'</span></th>';
  }).join('') + '</tr>';

  var body = '';
  for (var i=0;i<n;i++){
    // Per check, flag this point if it's that check's thinnest — the thin spot is the
    // reading that matters, and scanning a column for it by eye is error-prone.
    body += '<tr><td class="l">'+(i+1)+' <span class="muted">'+esc(pointLabel(sec,i))+'</span></td>' +
      shown.map(function(c){
        var v = c['T'+(i+1)];
        if (v === '' || v === undefined || v === null) return '<td class="muted">—</td>';
        var all = [];
        for (var k=1;k<=n;k++){ var x = num(c['T'+k]); if (x !== null) all.push(x); }
        var isMin = all.length > 1 && Number(v) === Math.min.apply(null, all);
        return '<td class="num"'+(isMin ? ' style="color:var(--blue);font-weight:700"' : '')+'>'+esc(v)+'</td>';
      }).join('') + '</tr>';
  }

  var foot = ['AvgThickness','ComputedID','Ovality'].map(function(f){
    var label = f==='AvgThickness' ? 'Avg wall' : f==='ComputedID' ? 'Computed ID' : 'Ovality';
    return '<tr><td class="l"><b>'+label+'</b></td>' + shown.map(function(c){
      return '<td class="num"><b>'+(c[f]===''||c[f]===undefined?'—':esc(c[f]))+'</b></td>';
    }).join('') + '</tr>';
  }).join('');
  var odRow = '<tr><td class="l"><b>OD</b></td>' + shown.map(function(c){
    return '<td class="num"><b>'+(c.OD===''||c.OD===undefined?'—':esc(c.OD))+'</b></td>';
  }).join('') + '</tr>';

  return '<div style="overflow-x:auto"><table style="margin-top:8px"><thead>'+head+'</thead>' +
      '<tbody>'+body+odRow+foot+'</tbody></table></div>' +
    '<p class="muted" style="font-size:10px;margin:4px 0 0">Blue = thinnest point of that check.' +
      (checks.length > shown.length ? ' Showing the latest '+shown.length+' of '+checks.length+' checks.' : '') + '</p>';
}

function rpNotesHtml(notes, sec){
  var rows = notes.filter(function(n){ return n.Section === sec; })
    .sort(function(a,b){ return new Date(a.Timestamp) - new Date(b.Timestamp); });
  if (!rows.length) return '<p class="muted">No notes.</p>';
  return '<table style="margin-top:6px"><thead><tr><th class="l" style="width:26%">Time / Operator</th><th class="l">Note</th></tr></thead><tbody>' +
    rows.map(function(nt){
      return '<tr><td class="l">'+esc(rpShortTime(nt.Timestamp))+'<br><span class="muted">'+esc(nt.Operator)+'</span></td>' +
        '<td class="l">'+esc(nt.Text)+'</td></tr>';
    }).join('') + '</tbody></table>';
}

function rpProblemsHtml(problems, sec){
  var rows = problems.filter(function(p){ return p.Section === sec; })
    .sort(function(a,b){ return new Date(a.Timestamp) - new Date(b.Timestamp); });
  if (!rows.length) return '';
  return '<h3 style="margin-top:12px">Problem reports</h3>' +
    rows.map(function(p){
      return '<div class="problemcard '+(p.Status==='Open'?'open':'')+'">' +
        '<div class="row"><b>'+(p.Status==='Open'?'<span class="flag">OPEN</span>':'<span class="ok">Resolved</span>')+'</b>' +
        (p.FootageMarker!=='' && p.FootageMarker!==undefined ? '<span class="muted">footage '+esc(p.FootageMarker)+' ft</span>' : '') +
        '<span class="spacer"></span><span class="muted">'+esc(rpShortTime(p.Timestamp))+' &middot; '+esc(p.Operator)+'</span></div>' +
        '<p style="margin:5px 0 0">'+esc(p.Description)+'</p>' +
        (p.ResolutionNotes ? '<p class="muted" style="margin:4px 0 0">Resolution: '+esc(p.ResolutionNotes)+
          ' &mdash; '+esc(p.ResolvedBy||'')+' '+esc(rpShortTime(p.ResolvedAt))+'</p>' : '') +
      '</div>';
    }).join('');
}

function rpSectionDetailHtml(data, sec){
  var wo = data.workOrder;
  var prefix = sec==='Baseline'?'BL':sec==='Braidline'?'BR':'CV';

  var series = data.readings.filter(function(r){ return r.Section===sec && r.Type==='OD'; })
    .sort(function(a,b){ return new Date(a.Timestamp)-new Date(b.Timestamp); });
  var vals = series.map(function(r){ return Number(r.Value); });
  var t = wo[prefix+'_TargetOD'], tol = wo[prefix+'_ODTol'];
  var tt = (t!=='' && t!==undefined && tol!=='' && tol!==undefined) ? {target:Number(t), tol:Number(tol)} : null;
  var chartProblems = (data.problemReports || []).filter(function(p){ return p.Section === sec; });

  var checks = (data.thicknessChecks || []).filter(function(c){ return c.Section === sec; })
    .sort(function(a,b){ return new Date(a.Timestamp)-new Date(b.Timestamp); });
  var material = (data.materialUsage || []).filter(function(m){ return m.Section === sec; });

  var odBlock = series.length
    ? '<div class="kpis"><div class="kpi"><b>OD readings</b><span>'+series.length+'</span></div>' +
      '<div class="kpi"><b>Min</b><span>'+Math.min.apply(null,vals)+'"</span></div>' +
      '<div class="kpi"><b>Max</b><span>'+Math.max.apply(null,vals)+'"</span></div>' +
      '<div class="kpi"><b>Avg</b><span>'+round4(vals.reduce(function(a,b){return a+b;},0)/vals.length)+'"</span></div></div>' +
      (tt ? '<div class="muted" style="font-size:10.5px;margin:6px 0">Shaded band = target '+tt.target+'" &plusmn; '+tt.tol+'" &middot; red labels show deviation, &#9888; marks a reported problem</div>' : '') +
      odChartSvg(series, tt, chartProblems)
    : '<p class="muted">No OD readings logged for this section.</p>';

  return '<section class="card rp-sec">' +
    '<h2>'+sec+' &mdash; measurements</h2>' +
    odBlock +
    '<h3 style="margin-top:14px">All readings</h3>' + rpReadingsTableHtml(data.readings, sec) +
    (sec !== 'Braidline'
      ? '<h3 style="margin-top:14px">Wall thickness ('+pointCount(sec)+'-point)</h3>' +
        (checks.length ? checksTableHtml(checks) + rpThicknessPointsHtml(sec, checks)
                       : '<p class="muted">No thickness checks recorded.</p>')
      : '') +
    (material.length ? '<h3 style="margin-top:14px">Material usage</h3>' + materialSummaryHtml(material) + materialTableHtml(material) : '') +
    '<h3 style="margin-top:14px">Notes</h3>' + rpNotesHtml(data.notes || [], sec) +
    rpProblemsHtml(data.problemReports || [], sec) +
  '</section>';
}

function renderReport(){
  var root = E('rpRoot');
  if (!root) return;
  var data = STATE.rpData;
  if (!data) return;
  var pipe = data.pipe, wo = data.workOrder;
  var openProblems = (data.problemReports || []).filter(function(p){ return p.Status === 'Open'; }).length;

  root.innerHTML =
    '<div class="row no-print" style="margin-bottom:10px">' +
      '<div><b style="font-size:19px">'+esc(pipe.PipeCode)+'</b> ' +
        '<span class="muted">work order '+esc(pipe.WorkOrderCode)+' &middot; '+esc(wo.Customer||'')+'</span></div>' +
      '<span class="spacer"></span>' +
      (openProblems ? '<span class="pill" style="background:var(--crit)">'+openProblems+' open issue'+(openProblems===1?'':'s')+'</span>' : '') +
      '<button class="btn sm" id="rpBackBtn">All reports</button>' +
      '<button class="btn sm" id="rpOpenPipeBtn">Open reel</button>' +
      '<button class="btn sm" id="rpTagBtn">Reel tag / QR</button>' +
      '<button class="btn sm" id="rpEmailBtn">Email report</button>' +
      '<button class="btn sm pri" id="rpPrintBtn">Print / PDF</button>' +
    '</div>' +

    // Printed copies lose the on-screen context, so the document restates who/what/when.
    '<section class="card">' +
      '<div class="row"><div>' +
        '<div style="font-size:19px;font-weight:700">'+esc(pipe.PipeCode)+'</div>' +
        '<div class="muted">Work order '+esc(pipe.WorkOrderCode)+' &middot; '+esc(wo.Customer||'')+
          ' &middot; '+esc(wo.ProductCode||'')+' &middot; '+esc(wo.PipeSize||'')+'</div>' +
      '</div><span class="spacer"></span><div style="text-align:right">' +
        pillHtml(pipe.OverallStatus) +
        '<div class="muted" style="font-size:10px;margin-top:4px">Report generated '+esc(fmtTime(new Date().toISOString()))+'</div>' +
      '</div></div>' +
    '</section>' +

    '<h2 style="margin:16px 0 8px">Run summary</h2>' +
    ['Baseline','Braidline','Coverline'].map(function(s){ return rpSectionSummaryHtml(data, s); }).join('') +

    '<h2 style="margin:16px 0 8px">Setup &amp; recipe reference</h2>' +
    setupReferenceHtml(wo) +

    '<h2 style="margin:16px 0 8px">Measurements</h2>' +
    ['Baseline','Braidline','Coverline'].map(function(s){ return rpSectionDetailHtml(data, s); }).join('') +

    '<p class="muted no-print" style="font-size:10px;text-align:center">Live &mdash; refreshes every 20 seconds. Last updated '+
      esc(STATE.rpLoadedAt ? STATE.rpLoadedAt.toLocaleTimeString() : '')+'</p>';

  E('rpBackBtn').addEventListener('click', loadReportIndex);
  E('rpOpenPipeBtn').addEventListener('click', function(){
    applyPipeData(data);
    STATE.pipeCode = pipe.PipeCode; STATE.workOrderCode = pipe.WorkOrderCode;
    go('operator', {pipeCode: pipe.PipeCode, section: firstOpenSection(pipe)});
  });
  E('rpTagBtn').addEventListener('click', function(){
    openTagFor(pipe.PipeCode, {view: 'reports', label: 'Back to report'});
  });
  E('rpEmailBtn').addEventListener('click', function(){
    var b = E('rpEmailBtn'); b.disabled = true;
    apiPost('sendReport', {pipeCode: pipe.PipeCode, trigger: 'manual'})
      .then(function(res){ toast('Report emailed to ' + res.sentTo); })
      .catch(function(err){ if (!err.sessionExpired) toast(err.message, true); })
      .then(function(){ b.disabled = false; });
  });
  E('rpPrintBtn').addEventListener('click', printReport);
}

// The default print rules hide everything but the reel tag, so printing a report has
// to flip which subtree is visible. The class comes off again afterwards; onafterprint
// doesn't fire everywhere, hence the timeout as a backstop.
function printReport(){
  document.body.classList.add('printing-report');
  var done = function(){ document.body.classList.remove('printing-report'); };
  window.addEventListener('afterprint', function h(){ window.removeEventListener('afterprint', h); done(); });
  setTimeout(done, 1500);
  window.print();
}

/* ============================= TV board (facility display) ============================= */
var TV_PAGE_SIZE = 4;
var tvClockTimer = null;

function viewTV(){
  return '<button class="btn sm tv-exit" data-nav="dashboard">Exit TV view</button>' +
    '<div class="tv-shell" id="tvRoot"><p class="muted">Loading&hellip;</p></div>';
}

function bindTV(){
  document.documentElement.setAttribute('data-theme', 'dark');
  document.body.classList.add('tv-active');
  STATE.tvPage = 0;
  STATE.tvDrillWO = null; STATE.tvDrillPipe = null; STATE.tvSection = null;
  loadTVBoard();
  STATE.dashTimer = pollEvery(loadTVBoard, 20000);
  STATE.tvPageTimer = setInterval(advanceTVPage, 8000);
  startTVClock();
}

function leaveTVIfActive(){
  if (STATE.view !== 'tv') return;
  document.documentElement.removeAttribute('data-theme');
  document.body.classList.remove('tv-active');
  if (STATE.tvPageTimer){ clearInterval(STATE.tvPageTimer); STATE.tvPageTimer = null; }
  stopTVClock();
}

function tvGoBoard(){ STATE.tvDrillWO = null; STATE.tvDrillPipe = null; STATE.tvSection = null; loadTVBoard(); }
function tvGoWorkOrder(code){ STATE.tvDrillWO = code; STATE.tvDrillPipe = null; STATE.tvSection = null; loadTVBoard(); }
function tvGoPipe(code){ STATE.tvDrillPipe = code; STATE.tvSection = null; loadTVBoard(); }

function startTVClock(){
  stopTVClock();
  var tick = function(){ var el = E('tvClock'); if (el) el.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); };
  tick();
  tvClockTimer = setInterval(tick, 1000);
}
function stopTVClock(){ if (tvClockTimer){ clearInterval(tvClockTimer); tvClockTimer = null; } }

function loadTVBoard(){
  if (STATE.tvDrillPipe){
    apiGet('getPipe', {pipeCode: STATE.tvDrillPipe}).then(function(data){
      STATE.tvPipeData = data;
      if (!STATE.tvSection) STATE.tvSection = firstOpenSection(data.pipe);
      renderTVPipeChart(data);
    }).catch(function(err){
      var r = E('tvRoot');
      if (r) r.innerHTML = '<div class="tv-empty flag">Could not reach the server:<br>'+esc(err.message)+'</div>';
    });
    return;
  }
  apiGet('dashboard').then(function(d){
    STATE.tvLastData = d;
    if (STATE.tvDrillWO){
      var g = d.active.concat(d.recentComplete).filter(function(x){ return x.workOrderCode === STATE.tvDrillWO; })[0];
      if (!g){ tvGoBoard(); return; }
      renderTVWorkOrder(g);
    } else {
      renderTVBoard(d);
    }
  }).catch(function(err){
    var r = E('tvRoot');
    if (r) r.innerHTML = '<div class="tv-empty flag">Could not reach the server:<br>'+esc(err.message)+'</div>';
  });
}

function advanceTVPage(){
  if (STATE.tvDrillWO || STATE.tvDrillPipe) return;
  if (!STATE.tvLastData) return;
  var count = Math.max(1, Math.ceil(STATE.tvLastData.active.length / TV_PAGE_SIZE));
  STATE.tvPage = (STATE.tvPage + 1) % count;
  renderTVBoard(STATE.tvLastData);
}

function renderTVBoard(d){
  var root = E('tvRoot');
  if (!root) return;
  STATE.tvLastData = d;
  var active = d.active;
  var pages = [];
  for (var i = 0; i < active.length; i += TV_PAGE_SIZE) pages.push(active.slice(i, i + TV_PAGE_SIZE));
  if (!pages.length) pages = [[]];
  if (STATE.tvPage >= pages.length) STATE.tvPage = 0;
  var pageItems = pages[STATE.tvPage];

  var cardsHtml = pageItems.length ? pageItems.map(tvCardHtml).join('') : '<div class="tv-empty">No active production right now.</div>';
  var totalPipes = active.reduce(function(sum,g){ return sum + g.activePipes.length; }, 0);

  root.innerHTML =
    '<div class="tv-header">' +
      '<div><div class="tv-title">SRTP Production Floor</div>' +
      '<div class="tv-sub">'+active.length+' active work order'+(active.length===1?'':'s')+' &middot; '+totalPipes+' reel'+(totalPipes===1?'':'s')+' running</div></div>' +
      '<div class="tv-clock" id="tvClock">&nbsp;</div>' +
    '</div>' +
    '<div class="tv-grid">' + cardsHtml + '</div>' +
    (pages.length > 1 ? '<div class="tv-dots">' + pages.map(function(_, i){ return '<span class="tv-dot'+(i===STATE.tvPage?' active':'')+'"></span>'; }).join('') + '</div>' : '');

  var clockEl = E('tvClock');
  if (clockEl) clockEl.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  qsa('[data-tvwo]', root).forEach(function(el){
    el.addEventListener('click', function(){ tvGoWorkOrder(el.dataset.tvwo); });
  });
}

function tvTimerLine(p){
  var t = p.prodTiming;
  if (!t) return '';
  var pct = t.expectedMinutes !== '' ? Math.round(100*t.runningMinutes/t.expectedMinutes) : null;
  var statusTxt = t.status==='running'
    ? '<span style="color:var(--good)">&#9679; Running</span>'
    : '<span style="color:var(--crit)">&#9679; Down ('+esc(t.downReason)+')</span>';
  return '<div class="tv-pipe-timer">'+statusTxt+' &middot; '+fmtHrsMin(t.runningMinutes)+
    (t.expectedMinutes!==''?' / '+fmtHrsMin(t.expectedMinutes)+(pct!==null?' ('+pct+'%)':''):'')+'</div>';
}

function tvCardHtml(g){
  var target = Number(g.projectLength);
  var pct = (g.projectLength && !isNaN(target) && target > 0) ? Math.max(0, Math.min(100, Math.round(100 * g.producedLength / target))) : null;

  var pipesHtml = g.activePipes.map(function(p){
    var lr = p.lastReading;
    var stale = lr && (Date.now() - new Date(lr.Timestamp).getTime()) > 75*60000;
    var valueClass = lr ? (lr.InTol==='Y' ? 'good' : lr.InTol==='N' ? 'bad' : '') : '';
    var curSection = p.cvStatus==='In progress' ? 'Coverline' : p.brStatus==='In progress' ? 'Braidline' : p.blStatus==='In progress' ? 'Baseline' : 'Not started';
    return '<div class="tv-pipe'+(stale||p.openProblems?' stale':'')+'">' +
      '<div class="tv-pipe-code">'+esc(p.pipeCode)+(p.openProblems?' <span class="tv-issue">&#9888; '+p.openProblems+'</span>':'')+'</div>' +
      '<div class="tv-pipe-sec">'+esc(curSection)+(stale?' &middot; STALE':'')+'</div>' +
      (lr ? '<div class="tv-pipe-val '+valueClass+'">'+esc(lr.Value)+'"</div>' : '<div class="tv-pipe-val muted">&mdash;</div>') +
      tvTimerLine(p) +
    '</div>';
  }).join('');

  return '<div class="tv-card tv-card-click" data-tvwo="'+esc(g.workOrderCode)+'">' +
    '<div class="tv-code">'+esc(g.workOrderCode)+' <span class="tv-pipecount">'+g.pipes.length+' reel'+(g.pipes.length===1?'':'s')+'</span>' +
    (g.openProblems ? ' <span class="tv-issue">&#9888; '+g.openProblems+'</span>' : '') + '</div>' +
    '<div class="tv-customer">'+esc(g.customer||'')+(g.productCode?' &middot; '+esc(g.productCode):'')+'</div>' +
    (pct!==null ? '<div class="tv-lenbar"><div class="tv-lenfill" style="width:'+pct+'%"></div></div>' +
      '<div class="tv-lenlabel">'+g.producedLength+' / '+g.projectLength+' ft ('+pct+'%)</div>' : '') +
    '<div class="tv-pipelist">' + pipesHtml + '</div>' +
  '</div>';
}

function renderTVWorkOrder(g){
  var root = E('tvRoot');
  if (!root) return;
  var target = Number(g.projectLength);
  var pct = (g.projectLength && !isNaN(target) && target > 0) ? Math.max(0, Math.min(100, Math.round(100 * g.producedLength / target))) : null;

  var pipesHtml = g.pipes.map(function(p){
    var lr = p.lastReading;
    var stale = lr && (Date.now() - new Date(lr.Timestamp).getTime()) > 75*60000 && p.overallStatus !== 'Complete';
    var valueClass = lr ? (lr.InTol==='Y' ? 'good' : lr.InTol==='N' ? 'bad' : '') : '';
    var curSection = p.cvStatus==='In progress' ? 'Coverline' : p.brStatus==='In progress' ? 'Braidline' : p.blStatus==='In progress' ? 'Baseline'
      : (p.overallStatus==='Complete' ? 'Complete' : 'Not started');
    return '<div class="tv-pipe tv-pipe-click'+(stale||p.openProblems?' stale':'')+'" data-tvpipe="'+esc(p.pipeCode)+'">' +
      '<div class="tv-pipe-code">'+esc(p.pipeCode)+(p.openProblems?' <span class="tv-issue">&#9888; '+p.openProblems+'</span>':'')+'</div>' +
      '<div class="tv-pipe-sec">'+esc(curSection)+(stale?' &middot; STALE':'')+'</div>' +
      (lr ? '<div class="tv-pipe-val '+valueClass+'">'+esc(lr.Value)+'"</div>' : '<div class="tv-pipe-val muted">&mdash;</div>') +
      tvTimerLine(p) +
    '</div>';
  }).join('');

  root.innerHTML =
    '<div class="tv-header">' +
      '<div><button class="tv-backbtn" id="tvBackToBoard">&larr; All work orders</button>' +
        '<div class="tv-title" style="margin-top:6px">'+esc(g.workOrderCode)+'</div>' +
        '<div class="tv-sub">'+esc(g.customer||'')+(g.productCode?' &middot; '+esc(g.productCode):'')+' &middot; '+g.pipes.length+' reel'+(g.pipes.length===1?'':'s')+'</div></div>' +
      '<div class="tv-clock" id="tvClock">&nbsp;</div>' +
    '</div>' +
    (pct!==null ? '<div class="tv-lenbar" style="max-width:640px"><div class="tv-lenfill" style="width:'+pct+'%"></div></div>' +
      '<div class="tv-lenlabel">'+g.producedLength+' / '+g.projectLength+' ft ('+pct+'%)</div>' : '') +
    '<div class="tv-pipelist" style="margin-top:20px">' + (pipesHtml || '<div class="tv-empty">No reels on this work order.</div>') + '</div>';

  var clockEl = E('tvClock');
  if (clockEl) clockEl.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  E('tvBackToBoard').addEventListener('click', tvGoBoard);
  qsa('[data-tvpipe]', root).forEach(function(el){
    el.addEventListener('click', function(){ tvGoPipe(el.dataset.tvpipe); });
  });
}

function renderTVPipeChart(data){
  var root = E('tvRoot');
  if (!root) return;
  var pipe = data.pipe, wo = data.workOrder, sec = STATE.tvSection;
  var prefix = sec==='Baseline'?'BL':sec==='Braidline'?'BR':'CV';

  function odSeries(s){ return data.readings.filter(function(r){ return r.Section===s && r.Type==='OD'; }).sort(function(a,b){ return new Date(a.Timestamp)-new Date(b.Timestamp); }); }
  function statsOf(vals){ if(!vals.length) return null; return {min:Math.min.apply(null,vals), max:Math.max.apply(null,vals), avg:round4(vals.reduce(function(a,b){return a+b;},0)/vals.length)}; }
  function targetTol(p){
    var t = wo[p+'_TargetOD'], tol = wo[p+'_ODTol'];
    return (t!=='' && t!==undefined && tol!=='' && tol!==undefined) ? {target:Number(t), tol:Number(tol)} : null;
  }

  var series = odSeries(sec);
  var vals = series.map(function(r){ return Number(r.Value); });
  var s = statsOf(vals);
  var tt = targetTol(prefix);
  var chartProblems = (data.problemReports || []).filter(function(p){ return p.Section === sec; });

  root.innerHTML =
    '<div class="tv-header">' +
      '<div><button class="tv-backbtn" id="tvBackToWO">&larr; '+esc(pipe.WorkOrderCode)+'</button>' +
        '<div class="tv-title" style="margin-top:6px">'+esc(pipe.PipeCode)+'</div>' +
        '<div class="tv-sub">'+esc(wo.Customer||'')+(wo.ProductCode?' &middot; '+esc(wo.ProductCode):'')+'</div></div>' +
      '<div class="tv-clock" id="tvClock">&nbsp;</div>' +
    '</div>' +
    '<div class="tv-tabs">' +
      ['Baseline','Braidline','Coverline'].map(function(s2){
        var st = pipe[(s2==='Baseline'?'BL':s2==='Braidline'?'BR':'CV')+'_Status'];
        return '<button class="tv-tabbtn'+(s2===sec?' active':'')+'" data-tvsec="'+s2+'">'+s2+' '+pillHtml(st)+'</button>';
      }).join('') +
    '</div>' +
    (s ? '<div class="tv-kpis">' +
        '<div class="tv-kpi"><b>Readings</b><span>'+series.length+'</span></div>' +
        '<div class="tv-kpi"><b>Min</b><span>'+s.min+'"</span></div>' +
        '<div class="tv-kpi"><b>Max</b><span>'+s.max+'"</span></div>' +
        '<div class="tv-kpi"><b>Avg</b><span>'+s.avg+'"</span></div>' +
      '</div>' + odChartSvg(series, tt, chartProblems)
      : '<div class="tv-empty">No OD readings yet for '+sec+'.</div>');

  var clockEl = E('tvClock');
  if (clockEl) clockEl.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  E('tvBackToWO').addEventListener('click', function(){ tvGoWorkOrder(pipe.WorkOrderCode); });
  qsa('[data-tvsec]', root).forEach(function(b){
    b.addEventListener('click', function(){ STATE.tvSection = b.dataset.tvsec; renderTVPipeChart(STATE.tvPipeData); });
  });
}

/* ============================= SCANNER ============================= */
var scanStream = null, scanRAF = null;
function startScan(onResult){
  var overlay = E('scanOverlay'), video = E('scanVideo'), canvas = E('scanCanvas');
  overlay.style.display = 'flex';
  navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}})
    .then(function(stream){
      scanStream = stream; video.srcObject = stream; video.play();
      var ctx = canvas.getContext('2d');
      function tick(){
        if (video.readyState === video.HAVE_ENOUGH_DATA){
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var res = jsQR(img.data, img.width, img.height);
          if (res && res.data){
            stopScan();
            var text = res.data;
            var m = text.match(/[?&]pipe=([^&]+)/);
            onResult(m ? decodeURIComponent(m[1]) : text);
            return;
          }
        }
        scanRAF = requestAnimationFrame(tick);
      }
      scanRAF = requestAnimationFrame(tick);
    })
    .catch(function(err){ overlay.style.display = 'none'; toast('Camera error: '+err.message, true); });
}
function stopScan(){
  var overlay = E('scanOverlay');
  overlay.style.display = 'none';
  if (scanRAF) cancelAnimationFrame(scanRAF);
  if (scanStream) scanStream.getTracks().forEach(function(t){ t.stop(); });
  scanStream = null;
}
E('scanCancel').addEventListener('click', stopScan);

/* ============================= BIND DISPATCH ============================= */
function bindView(){
  if (STATE.view === 'login') bindLogin();
  else if (STATE.view === 'admin') bindAdmin();
  else if (STATE.view === 'reports') bindReports();
  else if (STATE.view === 'archive') bindArchive();
  else if (STATE.view === 'home') bindHome();
  else if (STATE.view === 'controller') bindController(false);
  else if (STATE.view === 'controllerNew') bindController(true);
  else if (STATE.view === 'addPipe') bindAddPipe();
  else if (STATE.view === 'tagPrinted') bindTagPrinted();
  else if (STATE.view === 'operator') bindOperator();
  else if (STATE.view === 'dashboard') bindDashboard();
  else if (STATE.view === 'woDashboard') bindWoDashboard();
  else if (STATE.view === 'pipeDetail') bindPipeDetail();
  else if (STATE.view === 'timers') bindTimers();
  else if (STATE.view === 'tv') bindTV();
}

document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-nav]');
  if (t) go(t.dataset.nav);
});

/* ============================= INIT ============================= */
(function init(){
  var params = new URLSearchParams(location.search);
  var qrKey = params.get('k') || '';
  var urlPipe = params.get('pipe') || '';

  setInterval(checkConnection, 30000);

  // A scanned tag: trade its key for an operator session, then get the key out of the
  // address bar. Done before anything renders so the login screen never flashes.
  if (qrKey){
    scrubKeyFromUrl();
    checkConnection();
    tryQrLogin(qrKey, urlPipe);
    return;
  }

  if (!isSignedIn()){
    STATE.view = 'login';
    checkConnection();
    render();
    return;
  }

  // The TV board is a controller display; an operator session landing on ?tv= gets
  // bounced to their reel lookup by go()'s ADMIN_VIEWS guard.
  if (params.get('tv')) STATE.view = 'tv';
  checkConnection();

  // A signed-in operator refreshing a reel URL (the tag's ?pipe= survives scrubKeyFromUrl)
  // goes straight back into that reel instead of through the lookup card.
  if (!isAdmin() && urlPipe && !params.get('tv')){
    render();
    openReelForOperator(urlPipe);
    return;
  }

  render();
})();
</script>
